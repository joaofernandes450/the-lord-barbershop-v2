<header class="header">
  <div class="brand">
    <a href="">
      <img src="assets/logos/the_lord_black.png" alt="The Lord" class="logo" />
    </a>
  </div>

  <nav class="nav">
    @if (isHandset$ | async) {
      <button
        type="button"
        mat-icon-button
        (click)="showMobileContent = !showMobileContent"
      >
        <mat-icon>{{ showMobileContent ? "close" : "menu" }}</mat-icon>
      </button>
    } @else {
      <a (click)="openReservationsDialog()">marcações.</a>
      <a (click)="scrollToItem('gallery')">galeria.</a>
      <a (click)="scrollToItem('stores')">lojas.</a>
      <a (click)="scrollToItem('contact')">contato.</a>
    }
  </nav>
</header>

@if (showMobileContent) {
  <div
    class="mobile-toolbar-content"
    animate.enter="fade-in"
    animate.leave="fade-out"
  >
    <div class="content">
      <a (click)="showMobileContent = false; openReservationsDialog()"
        >marcações.</a
      >
      <a (click)="showMobileContent = false; scrollToItem('gallery')"
        >galeria.</a
      >
      <a (click)="showMobileContent = false; scrollToItem('stores')">lojas.</a>
      <a (click)="showMobileContent = false; scrollToItem('contact')"
        >contato.</a
      >
    </div>
  </div>
}
