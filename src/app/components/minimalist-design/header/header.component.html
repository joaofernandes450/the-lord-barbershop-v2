<header class="header">
  <div class="brand">
    <a href="">
      <img src="assets/logos/the_lord_black.png" alt="The Lord" class="logo" />
    </a>
  </div>

  <nav class="nav">
    @if (isHandset$ | async) {
      <button
        type="button"
        mat-icon-button
        (click)="showMobileContent = !showMobileContent"
      >
        <mat-icon>{{ showMobileContent ? "close" : "menu" }}</mat-icon>
      </button>
    } @else {
      <a href="#bookings">Marcações</a>
      <a href="#gallery">Galeria</a>
      <a href="#stores">Lojas</a>
      <a href="#contact">Contato</a>
    }
  </nav>
</header>

@if (showMobileContent) {
  <div
    class="mobile-toolbar-content"
    animate.enter="fade-in"
    animate.leave="fade-out"
  >
    <div class="content">
      <a href="#bookings" (click)="showMobileContent = false; (true)"
        >Marcações</a
      >
      <a href="#gallery" (click)="showMobileContent = false; (true)">Galeria</a>
      <a href="#stores" (click)="showMobileContent = false; (true)">Lojas</a>
      <a href="#contact" (click)="showMobileContent = false; (true)">Contato</a>
    </div>
  </div>
}
